[package]
name = "countersigning"
version = "0.1.0"
edition.workspace = true
description = "A Holochain coordinator zome for countersigning"
publish = false

[lib]
name = "countersigning_coordinator"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
# This zome is the one place that needs the countersigning host functions.
hdk = { workspace = true, features = ["unstable-countersigning"] }
countersigning_integrity = { workspace = true }

[lints]
workspace = true

name: "Run canonical scaled performance tests on Nomad cluster and Threefold nodes"

on:
  workflow_dispatch:
    inputs:
      rebuild-all-scenarios:
        description: "Force a rebuild of all scenarios even if no relevant files have changed"
        type: boolean
        required: false
        default: false
  schedule:
    - cron: "0 0 * * 5" # Run Nomad workflow at 00:00 on Fridays

concurrency:
  group: nomad # This is the same group as all other Nomad workflows
  cancel-in-progress: false

jobs:
  deploy-threefold-nodes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install nix
        uses: cachix/install-nix-action@v31

      - name: Setup cachix
        uses: cachix/cachix-action@v17
        with:
          name: holochain-ci
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"

      - name: Check available nodes in nomad
        id: check-available-nomad-nodes
        env:
          NIXPKGS_ALLOW_UNFREE: 1
          NOMAD_ADDR: https://nomad-server-01.holochain.org:4646
          NOMAD_CACERT: "${{ github.workspace }}/nomad/server-ca-cert.pem"
          NOMAD_TOKEN: ${{ secrets.NOMAD_ACCESS_TOKEN }}
        run: |
          set -euo pipefail

          nomad_bin="$(nix build --no-link --print-out-paths --impure --inputs-from . nixpkgsUnstable#nomad_1_11)/bin/nomad"
          COUNT="$(NOMAD_BIN="$nomad_bin" ./nomad/scripts/count_eligible_nodes.sh --eligible-only --include-threefold-node-pool)"

          echo "count=$COUNT" >> "$GITHUB_OUTPUT"

      - name: Provision additional nodes from Threefold
        timeout-minutes: 120
        env:
          THREEFOLD_TFCHAIN_WALLET_MNEMONIC: ${{ secrets.THREEFOLD_TFCHAIN_WALLET_MNEMONIC }}

          # Additional nodes provisioned in case some fail to deploy. In practice this seems to happen infrequently.
          THREEFOLD_NODES_BUFFER_COUNT: 20
        run: |
          set -euo pipefail

          # Read canonical-scaled scenario vars to determine max nodes required by a single scenario.
          MAX_SCENARIO_NODES_COUNT=$(jq -s 'map((.assignments // []) | map(.nodes // 1) | add // 1) | max // 1' \
            nomad/job-variants/canonical-scaled/vars/*.json)

          # Determine number of additional nodes needed
          AVAILABLE_NODES="${{ steps.check-available-nomad-nodes.outputs.count }}"
          MIN_THREEFOLD_NODES_COUNT=$(( MAX_SCENARIO_NODES_COUNT - AVAILABLE_NODES ))

          echo "Available nodes: $AVAILABLE_NODES"
          echo "Max nodes required by a scenario: $MAX_SCENARIO_NODES_COUNT"
          echo "Required additional Threefold nodes: $MIN_THREEFOLD_NODES_COUNT"
          echo "Additional buffer nodes: $THREEFOLD_NODES_BUFFER_COUNT"

          if [ "$MIN_THREEFOLD_NODES_COUNT" -gt 0 ]; then
            THREEFOLD_VMS_COUNT=$(( MIN_THREEFOLD_NODES_COUNT + THREEFOLD_NODES_BUFFER_COUNT ))
            echo "Provisioning ${THREEFOLD_VMS_COUNT} threefold VMs with dynamic Europe-first placement"

            # Deploy threefold nodes dynamically based on available capacity.
            nix develop .#ci --command deployer \
              --mnemonic "$THREEFOLD_TFCHAIN_WALLET_MNEMONIC" \
              --target-vms "$THREEFOLD_VMS_COUNT" \
              --prefix "wt_${GITHUB_RUN_ID}" \
              --flist "https://hub.threefold.me/holochain.3bot/ghcr.io-holochain-wind-tunnel-runner-threefold-latest.flist" \
              --entrypoint "/entrypoint.sh" \
              --regions "europe,americas,asia,africa,oceania" \
              --network main \
              --vm-cpu 2 \
              --vm-memory-gb 8 \
              --vm-disk-gb 20 \
              --max-concurrency 8
            echo "Deployed threefold nodes."
          fi

  run-scenarios:
    name: Run Scenario ${{ matrix.job-name }}
    needs: deploy-threefold-nodes
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        job-name:
          - remote_call_rate
          - remote_signals
          - dht_sync_lag
          - validation_receipts
          - write_get_agent_activity
          - write_get_agent_activity_volatile
          - write_validated_must_get_agent_activity
          - zero_arc_create_data
          - zero_arc_create_data--high_zero
          - zero_arc_create_data_validated
          - zero_arc_create_data_validated--high_zero
          - zero_arc_create_and_read
          - full_arc_create_validated_zero_arc_read
          - full_arc_create_validated_zero_arc_read--high_zero
          - mixed_arc_get_agent_activity
          - mixed_arc_must_get_agent_activity
          - unyt_chain_transaction
          - unyt_chain_transaction_zero_arc
          - two_party_countersigning
    runs-on: ubuntu-latest
    timeout-minutes: 480
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/nomad
        with:
          nomad-access-token: ${{ secrets.NOMAD_ACCESS_TOKEN }}
          hetzner-buckets-access: ${{ secrets.HETZNER_HOLOCHAIN_INFRA_BUCKETS_ACCESS }}
          hetzner-buckets-secret: ${{ secrets.HETZNER_HOLOCHAIN_INFRA_BUCKETS_SECRET }}
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
          job-name: ${{ matrix.job-name }}
          holochain-bin-url: https://github.com/holochain/holochain/releases/download/holochain-0.6.1/holochain-unstable-x86_64-unknown-linux-gnu
          nomad-job-variant-directory: "nomad/job-variants/canonical-scaled"
          include-threefold-node-pool: "true"
          force-rebuild: ${{ inputs.rebuild-all-scenarios }}

  post-run-scenarios:
    needs: run-scenarios
    uses: ./.github/workflows/nomad-common-post.yaml
    if: ${{ always() }}
    secrets:
      NOMAD_ACCESS_TOKEN: ${{ secrets.NOMAD_ACCESS_TOKEN }}
      INFLUX_TOKEN: ${{ secrets.INFLUX_TOKEN }}
      HETZNER_HOLOCHAIN_INFRA_BUCKETS_ACCESS: ${{ secrets.HETZNER_HOLOCHAIN_INFRA_BUCKETS_ACCESS }}
      HETZNER_HOLOCHAIN_INFRA_BUCKETS_SECRET: ${{ secrets.HETZNER_HOLOCHAIN_INFRA_BUCKETS_SECRET }}
      CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
    with:
      holochain-bin-url: https://github.com/holochain/holochain/releases/download/holochain-0.6.1/holochain-unstable-x86_64-unknown-linux-gnu
      enable-summary-uploads: true
      ignore-summary-errors: true

  remove-threefold-nodes:
    runs-on: ubuntu-latest
    needs: post-run-scenarios
    if: ${{ always() }}
    steps:
      - uses: actions/checkout@v6

      - name: Install nix
        uses: cachix/install-nix-action@v31

      - name: Setup cachix
        uses: cachix/cachix-action@v17
        with:
          name: holochain-ci
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"

      - name: Cancel all Threefold nodes
        env:
          THREEFOLD_TFCHAIN_WALLET_MNEMONIC: ${{ secrets.THREEFOLD_TFCHAIN_WALLET_MNEMONIC }}
        run: |-
          cleanup() {
            rm -f ~/.config/.tfgridconfig
          }
          trap cleanup EXIT

          # Set login config for tf-grid-cmd
          printf '{"mnemonics":"%s","network":"main"}\n' "$THREEFOLD_TFCHAIN_WALLET_MNEMONIC" > ~/.config/.tfgridconfig

          # Cancel all threefold deployment contracts
          nix develop .#ci --command tf-grid-cmd cancel contracts -a

      - name: Notify team via Mattermost if cancellation failed
        uses: holochain/actions/mattermost-notify@v1.8.0
        if: ${{ failure() }}
        with:
          MATTERMOST_PERSONAL_ACCESS_TOKEN: ${{ secrets.HOLOCHAIN_NOTIFIER_MATTERMOST_PERSONAL_ACCESS_TOKEN }}
          channel_id: cxskxqhb37rtjp5w8myri3pdhh # HCF Tech channel
          message: |-
            ALERT! A nomad canonical-scaled workflow run *failed* to cancel all Threefold node contracts.
            You may need to visit the [Threefold grid dashboard](https://dashboard.grid.tf/) to cancel all contracts manually.

            Workflow run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
